<rect width="920" height="720" fill="#fff"/><text x="40" y="36" class="s" letter-spacing="1.6">SECUENCIA · COMPRA</text><text x="40" y="68" class="h" font-size="22">Compra de productos</text><text x="40" y="90" class="s">POST /api/sale/purchase · transacción, bloqueo de stock y cupón opcional</text>
<g class="l"><line x1="100" y1="158" x2="100" y2="640"/><line x1="270" y1="158" x2="270" y2="640"/><line x1="440" y1="158" x2="440" y2="640"/><line x1="610" y1="158" x2="610" y2="640"/><line x1="780" y1="158" x2="780" y2="640"/></g>
<g fill="#dbeafe" stroke="#2563eb"><rect x="266" y="204" width="8" height="376"/><rect x="436" y="244" width="8" height="304"/></g><rect x="606" y="284" width="8" height="72" fill="#d1fae5" stroke="#0f766e"/><rect x="776" y="404" width="8" height="52" fill="#ffedd5" stroke="#c2410c"/>
