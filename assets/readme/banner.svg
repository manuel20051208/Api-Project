<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="BizAdmin API: inventario, catálogo, ventas y cupones. Java 25, Spring Boot 4.1, PostgreSQL 16, JWT + OAuth2, Docker.">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    /* Animacion liviana: solo transform de un grupo chico y el dashoffset del piso. */
    .cart { animation: roll 4s ease-in-out infinite alternate; }
    .road { stroke-dasharray: 2 10; animation: run 0.8s linear infinite; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(330px); } }
    @keyframes run { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { .cart, .road { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="#ffffff" stroke="#e4e4e7"/>

  <text x="60" y="72" class="mono" font-size="12" letter-spacing="3" fill="#a1a1aa">API REST  ·  INVENTARIO Y VENTAS</text>
  <text x="57" y="136" class="sans" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#09090b">BizAdmin<tspan font-weight="300" fill="#a1a1aa"> API</tspan></text>
  <text x="60" y="174" class="sans" font-size="18" fill="#52525b">Inventario, catálogo, ventas y cupones. Un carrito, muchos vendedores.</text>
  <text x="60" y="212" class="mono" font-size="13" fill="#71717a">Java 25  ·  Spring Boot 4.1  ·  PostgreSQL 16  ·  JWT + OAuth2  ·  Docker</text>

  <text x="1140" y="72" text-anchor="end" class="mono" font-size="12" fill="#a1a1aa">POST /api/sale/purchase</text>
  <line class="road" x1="760" y1="211" x2="1140" y2="211" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(762 136)">
    <g class="cart">
      <g transform="scale(1.4)">
        <rect x="24" y="14" width="13" height="13" rx="2" fill="#d4d4d8"/>
        <rect x="39" y="8"  width="16" height="19" rx="2" fill="#09090b"/>
        <rect x="57" y="16" width="10" height="11" rx="2" fill="#71717a"/>
        <path d="M0 4h12l10 32h40l8-24H16" fill="none" stroke="#09090b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="28" cy="47" r="4.5" fill="#ffffff" stroke="#09090b" stroke-width="2.2"/>
        <circle cx="58" cy="47" r="4.5" fill="#ffffff" stroke="#09090b" stroke-width="2.2"/>
      </g>
    </g>
  </g>
</svg>
