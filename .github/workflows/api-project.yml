name: api-project.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apiproject
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/apiproject
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: "KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioq"
      JWT_EXPIRATION_MS: "86400000"
      BASIC_AUTH_USERNAME: test
      BASIC_AUTH_PASSWORD: test
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      URL_FOR_REQUESTING_AND_RESPONSIVES: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Configurar java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin' # Corregido: termurin -> temurin
          cache: 'maven'
      - name: Correr tests
        run: mvn test

  build-docker:
    needs: test
    if: github.event_name == 'push' # Solo crea imagen si se hace merge a main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para subir a GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construir el JAR
        run: mvn clean package -DskipTests

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub

      - name: Convertir nombre del repo a minúsculas
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build y push de imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:latest # Usa tu usuario/repo automáticamente

  deploy:
    needs: build-docker
    if: github.event_name == 'push' # Evita despliegues desde un Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Render
        uses: JorgeLNJunior/render-deploy@v2.0.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          clear_cache: true