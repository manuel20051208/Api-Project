<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="purchase-title purchase-desc">
<title id="purchase-title">Secuencia de compra de productos</title><desc id="purchase-desc">El cliente solicita una compra; SaleService valida, bloquea stock, aplica un cupón opcional y guarda la venta.</desc>
