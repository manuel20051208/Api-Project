services:
  db:
    image: postgres:16-alpine
    container_name: apiproject-db
    environment:
      POSTGRES_DB: apiproject
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en tu archivo .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    # --- Limites de RAM (VM de 1 GB: API + Postgres + SO) ---
    mem_limit: ${DB_MEM_LIMIT:-160m}
    memswap_limit: ${DB_MEM_LIMIT:-160m}
    restart: unless-stopped
    # Postgres con buffers chicos para entrar en 160 MB (default: shared_buffers=128MB)
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=96MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d apiproject" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: apiproject-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: apiproject
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ""
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CORS_ALLOWED_ORIGIN: ${URL_FOR_REQUESTING_AND_RESPONSIVES}
    ports:
      - "0.0.0.0:8080:8080"
    # --- Limites de RAM (VM de 1 GB: API + Postgres + SO) ---
    # El JVM toma el 50% del limite como heap (-XX:MaxRAMPercentage en el Dockerfile).
    # Subilo/bajalo desde .env (API_MEM_LIMIT / DB_MEM_LIMIT) sin tocar este archivo.
    mem_limit: ${API_MEM_LIMIT:-576m}
    memswap_limit: ${API_MEM_LIMIT:-576m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data: