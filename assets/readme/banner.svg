<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="BizAdmin API: inventario, catálogo, ventas y cupones. Java 25, Spring Boot 4.1, PostgreSQL 16, JWT + OAuth2, Docker.">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    /* Liviano: solo transform. El carrito avanza en un sentido y las ruedas giran. */
    .cart  { animation: go 3.6s linear -1.8s infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.6s linear infinite; }
    @keyframes go   { from { transform: translateX(-300px); } to { transform: translateX(290px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cart, .wheel { animation: none; } }
  </style>
  <defs>
    <clipPath id="track"><rect x="700" y="90" width="460" height="140"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="#ffffff" stroke="#e4e4e7"/>

  <text x="60" y="72" class="mono" font-size="12" letter-spacing="3" fill="#a1a1aa">API REST  ·  INVENTARIO Y VENTAS</text>
  <text x="57" y="136" class="sans" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#7c4a2d">BizAdmin<tspan font-weight="300" fill="#b08968"> API</tspan></text>
  <text x="60" y="174" class="sans" font-size="18" fill="#52525b">Inventario, catálogo, ventas y cupones. Un carrito, muchos vendedores.</text>
  <text x="60" y="212" class="mono" font-size="13" fill="#71717a">Java 25  ·  Spring Boot 4.1  ·  PostgreSQL 16  ·  JWT + OAuth2  ·  Docker</text>

  <text x="1140" y="72" text-anchor="end" class="mono" font-size="12" fill="#a1a1aa">POST /api/sale/purchase</text>

  <g clip-path="url(#track)">
    <line x1="700" y1="211" x2="1160" y2="211" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g transform="translate(880 136)">
      <g class="cart">
        <g transform="scale(1.4)">
          <line x1="-34" y1="18" x2="-12" y2="18" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round"/>
          <line x1="-26" y1="28" x2="-8"  y2="28" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
          <rect x="24" y="14" width="13" height="13" rx="2" fill="#d4d4d8"/>
          <rect x="39" y="8"  width="16" height="19" rx="2" fill="#09090b"/>
          <rect x="57" y="16" width="10" height="11" rx="2" fill="#71717a"/>
          <path d="M0 4h12l10 32h40l8-24H16" fill="none" stroke="#09090b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
          <g class="wheel"><circle cx="28" cy="47" r="4.5" fill="#ffffff" stroke="#09090b" stroke-width="2.2"/><line x1="28" y1="43.5" x2="28" y2="50.5" stroke="#09090b" stroke-width="1.4"/></g>
          <g class="wheel"><circle cx="58" cy="47" r="4.5" fill="#ffffff" stroke="#09090b" stroke-width="2.2"/><line x1="58" y1="43.5" x2="58" y2="50.5" stroke="#09090b" stroke-width="1.4"/></g>
        </g>
      </g>
    </g>
    <rect x="700" y="90" width="460" height="140" fill="url(#fade)"/>
  </g>
</svg>
