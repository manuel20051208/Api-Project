name: api-project.yml
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'termurin'
          cache: 'maven'
      - name: Correr tests
        run: mvn test

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construir el JAR
        run: mvn clean package -DskipTests   # ya corrimos tests antes, no los repitas

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
                      - name: Build y push de imagen Docker
                      uses: docker/build-push-action@v6
                      with:
                        context: .
                        push: true
                        tags: tuusuario/tu-api:latest

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true