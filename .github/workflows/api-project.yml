name: api-project.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin' # Corregido: termurin -> temurin
          cache: 'maven'
      - name: Correr tests
        run: mvn test

  build-docker:
    needs: test
    if: github.event_name == 'push' # Solo crea imagen si se hace merge a main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para subir a GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construir el JAR
        run: mvn clean package -DskipTests

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub

      - name: Convertir nombre del repo a minúsculas
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build y push de imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:latest # Usa tu usuario/repo automáticamente

  deploy:
    needs: build-docker
    if: github.event_name == 'push' # Evita despliegues desde un Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true