<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Reportes con patrón Factory: GET /dashboard-controller/excel o /pdf llega a DashboardService.downloadReport, que lee report_view_dashboard y pide a ReportServiceFactory.getService(FileTypes) la implementación: ExcelService con Apache POI genera reporte_usuarios.xlsx y PdfService con OpenPDF genera reporte_usuarios.pdf. Ambos responden con Content-Disposition: attachment.">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .eye { font-size: 12px; letter-spacing: 2px; }
    .name { font-size: 20px; font-weight: 700; fill: #09090b; }
    .det { font-size: 13px; fill: #52525b; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 6 8; animation: run 1.2s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3f3f46"/>
    </marker>
  </defs>

  <rect width="1200" height="370" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="369" rx="18" fill="none" stroke="#e4e4e7"/>
  <text x="30" y="40" class="mono eye" fill="#a1a1aa">REPORTES  /  PATRÓN FACTORY</text>

  <!-- endpoint -->
  <g transform="translate(30 125)">
    <rect width="220" height="90" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">GET · ADMIN</text>
    <text x="16" y="52" class="sans name" style="font-size:15px">/dashboard-controller</text>
    <text x="16" y="74" class="mono det">/excel  ·  /pdf</text>
  </g>

  <!-- servicio -->
  <g transform="translate(310 125)">
    <rect width="220" height="90" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">SERVICE</text>
    <text x="16" y="52" class="sans name">DashboardService</text>
    <text x="16" y="74" class="mono det">downloadReport(id, type)</text>
  </g>

  <!-- datos -->
  <g transform="translate(310 262)">
    <rect width="220" height="76" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">VISTA SQL</text>
    <text x="16" y="54" class="mono" font-size="15" font-weight="700" fill="#09090b">report_view_dashboard</text>
  </g>

  <!-- factory -->
  <g transform="translate(590 125)">
    <rect width="220" height="90" rx="12" fill="#09090b"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">FACTORY</text>
    <text x="16" y="52" class="sans name" style="font-size:17px;fill:#fafafa">ReportServiceFactory</text>
    <text x="16" y="74" class="mono det" style="fill:#d4d4d8">getService(FileTypes)</text>
  </g>

  <!-- excel -->
  <g transform="translate(870 55)">
    <rect width="300" height="100" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">EXCEL · APACHE POI</text>
    <text x="16" y="54" class="sans name">ExcelService</text>
    <text x="16" y="80" class="mono det">→ reporte_usuarios.xlsx</text>
  </g>

  <!-- pdf -->
  <g transform="translate(870 185)">
    <rect width="300" height="100" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="16" y="26" class="mono eye" fill="#a1a1aa">PDF · OPENPDF</text>
    <text x="16" y="54" class="sans name">PdfService</text>
    <text x="16" y="80" class="mono det">→ reporte_usuarios.pdf</text>
  </g>

  <!-- flechas -->
  <path class="flow" d="M256 170H302" stroke="#3f3f46" marker-end="url(#a)"/>
  <path class="flow" d="M420 256V223" stroke="#3f3f46" marker-end="url(#a)"/>
  <path class="flow" d="M536 170H582" stroke="#3f3f46" marker-end="url(#a)"/>
  <path class="flow" d="M816 155H840V105H862" stroke="#3f3f46" marker-end="url(#a)"/>
  <path class="flow" d="M816 185H840V235H862" stroke="#3f3f46" marker-end="url(#a)"/>

  <text x="1170" y="330" text-anchor="end" class="sans" font-size="14" fill="#71717a">Ambos responden con <tspan class="mono" fill="#09090b">Content-Disposition: attachment</tspan></text>
</svg>
