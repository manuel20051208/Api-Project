<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="catalog-title catalog-desc">
<title id="catalog-title">Secuencia de catálogo y búsqueda de productos</title><desc id="catalog-desc">El cliente consulta catálogo o filtros; ProductService revisa la caché y solo consulta el repositorio cuando no existe una respuesta almacenada.</desc>
<defs><style>.h{font:600 14px Arial;fill:#172033}.s{font:11px Arial;fill:#52617a}.m{font:11px Arial;fill:#334155}.l{stroke:#cbd5e1;stroke-dasharray:4 5}.a{stroke:#2563eb;stroke-width:1.6;fill:none}.r{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none}.x{stroke:#c2410c;stroke-width:1.8;fill:none}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:1.2}.c{fill:#f8fafc;stroke:#64748b;stroke-width:1.2}.d{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.2}</style><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#2563eb"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#64748b"/></marker><marker id="x" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#c2410c"/></marker></defs>
<rect width="920" height="680" fill="#fff"/><text x="40" y="36" class="s" letter-spacing="1.6">SECUENCIA · CATÁLOGO Y FILTROS</text><text x="40" y="68" class="h" font-size="22">Catálogo y búsqueda de productos</text><text x="40" y="90" class="s">Caché por consulta y carga de productos con imágenes solo cuando es necesaria.</text>
<g class="l"><line x1="100" y1="158" x2="100" y2="602"/><line x1="270" y1="158" x2="270" y2="602"/><line x1="440" y1="158" x2="440" y2="602"/><line x1="610" y1="158" x2="610" y2="602"/><line x1="780" y1="158" x2="780" y2="602"/></g><g fill="#dbeafe" stroke="#2563eb"><rect x="266" y="204" width="8" height="332"/><rect x="436" y="244" width="8" height="260"/></g><rect x="606" y="284" width="8" height="152" fill="#f1f5f9" stroke="#64748b"/><rect x="776" y="396" width="8" height="48" fill="#d1fae5" stroke="#0f766e"/>
<line x1="100" y1="216" x2="270" y2="216" class="a" marker-end="url(#a)"/><text x="185" y="202" text-anchor="middle" class="m">GET catálogo o búsqueda</text><line x1="270" y1="256" x2="440" y2="256" class="a" marker-end="url(#a)"/><text x="355" y="242" text-anchor="middle" class="m">consulta y parámetros</text><line x1="440" y1="296" x2="610" y2="296" class="a" marker-end="url(#a)"/><text x="525" y="282" text-anchor="middle" class="m">buscar clave @Cacheable</text><line x1="610" y1="336" x2="440" y2="336" class="r" marker-end="url(#r)"/><text x="525" y="322" text-anchor="middle" class="m">respuesta o cache miss</text>
<rect x="420" y="356" width="380" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="420" y="356" width="48" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="444" y="370" text-anchor="middle" class="s" font-weight="700">ALT</text><text x="480" y="370" class="s">[cache miss]</text><text x="480" y="460" class="s">[cache hit: se omite repositorio]</text>
<line x1="440" y1="396" x2="780" y2="396" class="a" marker-end="url(#a)"/><text x="610" y="390" text-anchor="middle" class="m">consultar productos con imágenes</text><line x1="780" y1="428" x2="440" y2="428" class="r" marker-end="url(#r)"/><text x="610" y="420" text-anchor="middle" class="m">productos e imágenes</text><line x1="440" y1="476" x2="270" y2="476" class="r" marker-end="url(#r)"/><text x="355" y="464" text-anchor="middle" class="m">ProductResponseDTO / Page</text><line x1="270" y1="508" x2="100" y2="508" class="x" marker-end="url(#x)"/><text x="185" y="496" text-anchor="middle" class="m">200 OK · productos + imágenes</text>
<g><rect x="40" y="116" width="120" height="42" rx="7" class="b"/><text x="100" y="140" text-anchor="middle" class="h">Cliente</text><text x="100" y="153" text-anchor="middle" class="s">frontend</text><rect x="210" y="116" width="120" height="42" rx="7" class="b"/><text x="270" y="140" text-anchor="middle" class="h">ProductController</text><text x="270" y="153" text-anchor="middle" class="s">/api/product</text><rect x="380" y="116" width="120" height="42" rx="7" class="b"/><text x="440" y="140" text-anchor="middle" class="h">ProductService</text><text x="440" y="153" text-anchor="middle" class="s">lectura</text><rect x="550" y="116" width="120" height="42" rx="7" class="c"/><text x="610" y="140" text-anchor="middle" class="h">Caché Spring</text><text x="610" y="153" text-anchor="middle" class="s">@Cacheable</text><rect x="720" y="116" width="120" height="42" rx="7" class="d"/><text x="780" y="140" text-anchor="middle" class="h">ProductRepository</text><text x="780" y="153" text-anchor="middle" class="s">PostgreSQL</text></g><line x1="40" y1="624" x2="880" y2="624" stroke="#e2e8f0"/><text x="40" y="650" class="s">activeProducts pagina IDs y luego carga imágenes; categoría y nombre consultan con imágenes.</text></svg>
